name: tests
on:
  push:
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m monitor.generate --output sample_data --end-date 2026-11-25
      - run: python -m monitor.cli --input sample_data --output /tmp/platform-report
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-platform-report
          path: /tmp/platform-report/
